name: Media integrity

on:
  push:
    paths:
      - README.md
      - docs/media/**
      - scripts/check_media.py
      - .github/workflows/media-integrity.yml
  pull_request:
    paths:
      - README.md
      - docs/media/**
      - scripts/check_media.py

jobs:
  validate-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install pillow
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python scripts/check_media.py
