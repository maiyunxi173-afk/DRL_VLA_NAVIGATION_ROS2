name: Python tests

on:
  push:
    paths:
      - src/drl_navigation_ros2/**
      - tests/**
      - pyproject.toml
      - .github/workflows/tests.yml
  pull_request:

jobs:
  pure-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install numpy pytest
      - run: PYTHONPATH=src python -m pytest -q -m "not ros"
